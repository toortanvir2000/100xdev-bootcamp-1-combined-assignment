<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <style>
      .d-none {
        display: none;
      }
      .recipe {
        padding: 1rem;
        background-color: #fdfdfd;
        border-radius: 0.5rem;
        border: 1px solid lavender;
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #recipes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }

      @media (max-width: 768px) {
        #recipes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <label id="label-category-type" for="category-type"
      >Select a category</label
    >
    <select id="category-type" aria-labelledby="label-category-type">
      <option value="">Please choose an option</option>
    </select>
    <button type="submit" onclick="submit()">Submit request!</button>

    <div class="d-none" id="recipe-div">
      <h3>Below are the Recipes you can choose from</h3>
      <div id="recipes"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
